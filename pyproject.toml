[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicefr"
version = "0.1.0"
description = "AI Assessor CEFR — chấm nói tiếng Anh theo CEFR, có bằng chứng và giảng viên duyệt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "argon2-cffi==25.1.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "simplemma==1.1.2",
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
# ASR local (M03): faster-whisper chạy weight whisper-small dạng CTranslate2.
asr = ["faster-whisper>=1.0"]
# VAD (M04): Silero, trọng số đi kèm gói, không tải mạng lúc chạy.
vad = ["silero-vad==6.2.1"]
google = ["cryptography>=46"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "cryptography>=46",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicefr = [
    "api/templates/*.html",
    "api/static/*.js",
    "api/static/*.css",
    "api/static/*.svg",
    "api/static/*.pdf",
    "api/static/art/*.svg",
    "api/static/fonts/*.woff2",
    "api/static/fonts/*.txt",
    "storage/migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cho phép test import helper dùng chung (tests.features.fixtures, tests.asr.fixtures)
# khi chạy `pytest` trơn, không chỉ `python -m pytest`.
pythonpath = ["."]
addopts = "-ra"
markers = [
    "smoke: cần model hoặc audio thật; không chạy mặc định (dùng -m smoke)",
]

[tool.coverage.run]
source = ["aicefr"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Script của skill SDD dùng chung, không thuộc code sản phẩm.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
