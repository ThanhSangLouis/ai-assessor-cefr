# CodeQL (D087): static analysis of the Python services, the browser scripts
# and these workflows, for injection, path traversal, unsafe deserialisation,
# DOM XSS and the like. Findings go to the repository's Security tab (code
# scanning) instead of failing the build: a person reads each one and either
# fixes it or dismisses it with a reason. Free for a public repository.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"  # Mondays 09:17 Vietnam time: new queries, old code
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages: nothing to build.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
