# The system as three services (D044), behind one gateway, on one machine.
#
#   cp .env.example .env    # set the two keys and the passwords
#   docker compose up --build
#   docker compose exec core python -m aicefr.accounts_cli them --but-danh QT-01 --vai-tro admin
#
# Then open http://localhost:8000. Only the gateway publishes a port; the
# services, MongoDB and Redis are reachable from each other only.
#
# The real recogniser is off by default: AICEFR_ASR=whisper downloads about
# 1.5 GB of model on first use, which should be a deliberate choice.

x-bus: &bus
  AICEFR_ENV: production
  # D050: Redis carries the work (BullMQ), the events (Streams) and the calls.
  AICEFR_BUS: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  AICEFR_MAX_JOBS: "2"

x-env: &env
  <<: *bus
  # Two keys: the internal one for the web service's calls to core, the
  # gateway's for the account it forwards. The speech service holds neither.
  AICEFR_INTERNAL_TOKEN: ${AICEFR_INTERNAL_TOKEN:?set AICEFR_INTERNAL_TOKEN in .env}
  AICEFR_GATEWAY_TOKEN: ${AICEFR_GATEWAY_TOKEN:?set AICEFR_GATEWAY_TOKEN in .env}
  # Only the gateway reaches the services (no published ports), and it
  # overwrites X-Forwarded-For with the address it saw: the client cannot set it.
  FORWARDED_ALLOW_IPS: "*"
  AICEFR_HTTPS_ONLY: ${AICEFR_HTTPS_ONLY:-0}
  AICEFR_PUBLIC_URL: ${AICEFR_PUBLIC_URL:-}
  AICEFR_GOOGLE_CLIENT_ID: ${AICEFR_GOOGLE_CLIENT_ID:-}
  AICEFR_GOOGLE_CLIENT_SECRET: ${AICEFR_GOOGLE_CLIENT_SECRET:-}
  AICEFR_GOOGLE_SIGNUP: ${AICEFR_GOOGLE_SIGNUP:-1}
  AICEFR_SELF_SIGNUP: ${AICEFR_SELF_SIGNUP:-1}
  # D069: the upgraded answer -- off unless a provider and its key are set.
  AICEFR_COACH_PROVIDER: ${AICEFR_COACH_PROVIDER:-off}
  AICEFR_COACH_MODEL: ${AICEFR_COACH_MODEL:-}
  AICEFR_COACH_DAILY: ${AICEFR_COACH_DAILY:-5}
  AICEFR_GROQ_API_KEY: ${AICEFR_GROQ_API_KEY:-}
  AICEFR_GEMINI_API_KEY: ${AICEFR_GEMINI_API_KEY:-}
  AICEFR_OPENROUTER_API_KEY: ${AICEFR_OPENROUTER_API_KEY:-}
  AICEFR_ANTHROPIC_API_KEY: ${AICEFR_ANTHROPIC_API_KEY:-}
  # D049/D057: the metered channel (runs and IDPoint, NetID). Off unless set;
  # core keeps the ledger, web shows the menu and the price on the submit page.
  AICEFR_METERING: ${AICEFR_METERING:-}
  AICEFR_PRICE_FIRST_MINUTE_RUNS: ${AICEFR_PRICE_FIRST_MINUTE_RUNS:-1.0}
  AICEFR_PRICE_EXTRA_MINUTE_RUNS: ${AICEFR_PRICE_EXTRA_MINUTE_RUNS:-0.7}
  AICEFR_PRICE_PRACTICE_FACTOR: ${AICEFR_PRICE_PRACTICE_FACTOR:-0.5}
  AICEFR_IDPOINT_PER_RUN: ${AICEFR_IDPOINT_PER_RUN:-2000}
  AICEFR_CREDIT_PACKS: ${AICEFR_CREDIT_PACKS:-10:19000,30:49000,100:149000}

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    environment:
      AICEFR_GATEWAY_TOKEN: ${AICEFR_GATEWAY_TOKEN:?set AICEFR_GATEWAY_TOKEN in .env}
    volumes:
      # The nginx image renders templates/*.template into conf.d at start,
      # replacing ${AICEFR_GATEWAY_TOKEN}. Generated: tools/gen_gateway.py.
      - ./deploy/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - core
      - web
    restart: unless-stopped

  # Accounts, consent, responses, review, blind rating, the feedback study,
  # lessons, achievements, plans and payment: every collection, one database (D048).
  core:
    build:
      context: .
      target: service
    image: aicefr-service:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *env
      AICEFR_SERVICE: core
      AICEFR_CORE_DB: mongodb://core:${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}@mongo:27017/aicefr?authSource=aicefr
      # D051: a database per service. The learning part and the metering
      # ledger write only their own; the core user may write the three.
      AICEFR_LEARNING_DB: mongodb://core:${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}@mongo:27017/aicefr_learning?authSource=aicefr
      AICEFR_METERING_DB: mongodb://core:${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}@mongo:27017/aicefr_metering?authSource=aicefr
      AICEFR_GOOGLE_DOMAIN: ${AICEFR_GOOGLE_DOMAIN:-}
      AICEFR_BILLING: ${AICEFR_BILLING:-}
      AICEFR_PAYMENT_GATEWAYS: ${AICEFR_PAYMENT_GATEWAYS:-sandbox}
      AICEFR_PAYMENTS_LIVE: ${AICEFR_PAYMENTS_LIVE:-}
      AICEFR_LICENSE_SECRET: ${AICEFR_LICENSE_SECRET:-}
      AICEFR_STRIPE_SECRET_KEY: ${AICEFR_STRIPE_SECRET_KEY:-}
      AICEFR_STRIPE_WEBHOOK_SECRET: ${AICEFR_STRIPE_WEBHOOK_SECRET:-}
      AICEFR_MOMO_PARTNER_CODE: ${AICEFR_MOMO_PARTNER_CODE:-}
      AICEFR_MOMO_ACCESS_KEY: ${AICEFR_MOMO_ACCESS_KEY:-}
      AICEFR_MOMO_SECRET_KEY: ${AICEFR_MOMO_SECRET_KEY:-}
      AICEFR_MOMO_ENDPOINT: ${AICEFR_MOMO_ENDPOINT:-}
      AICEFR_VNPAY_TMN_CODE: ${AICEFR_VNPAY_TMN_CODE:-}
      AICEFR_VNPAY_HASH_SECRET: ${AICEFR_VNPAY_HASH_SECRET:-}
      AICEFR_VNPAY_URL: ${AICEFR_VNPAY_URL:-}
      AICEFR_MODEL_DIR: /models
      # Extra pins: only for the synthetic artifacts of tests/fixtures/models (.env.example).
      AICEFR_MODEL_PINS: ${AICEFR_MODEL_PINS:-}
    volumes:
      # Recordings: written here, read by the speech service. Personal data:
      # keep it on a named volume, back it up, never bake it into an image.
      - uploads:/data/uploads
      # Scoring artifacts (W7-S01): Speak & Improve statistics, kept outside
      # Git and the image, read only, checked against pinned SHA-256 values.
      - ${AICEFR_MODEL_HOST_DIR:-../aicefr-models}:/models:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The pages and their static files; it asks core for what a page quotes.
  web:
    image: aicefr-service:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *env
      AICEFR_SERVICE: web
      AICEFR_CORE_URL: http://core:8000
    depends_on:
      - core

  # QC, recognition, features, scoring: the only image with Whisper and ffmpeg.
  speech:
    build:
      context: .
      target: speech
      args:
        VAD: "1"
    image: aicefr-speech:latest
    restart: unless-stopped
    environment:
      <<: *bus
      # Set to "whisper" for real scoring. Anything else and the interface
      # shows a warning that the scores are meaningless.
      AICEFR_ASR: ${AICEFR_ASR:-fake}
      AICEFR_FAKE_TRANSCRIPT: ${AICEFR_FAKE_TRANSCRIPT:-}
      AICEFR_MODEL_DIR: /models
      # Extra pins: only for the synthetic artifacts of tests/fixtures/models (.env.example).
      AICEFR_MODEL_PINS: ${AICEFR_MODEL_PINS:-}
    volumes:
      # Read only: the speech service reads recordings, never writes or deletes one.
      - uploads:/data/uploads:ro
      - ${AICEFR_MODEL_HOST_DIR:-../aicefr-models}:/models:ro
      # Model cache, so a restart does not re-download 1.5 GB.
      - models:/home/aicefr/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Whisper large-v3-turbo needs headroom; below this it is OOM-killed
          # mid-transcription and the response is closed as FAILED.
          memory: 6G

  mongo:
    # 7.0, not 8.x: MongoDB 8 refuses to start on Linux kernels 6.19-7.0.13
    # (SERVER-121912), which current cloud images ship. 7.0 is supported to 2027.
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}
    volumes:
      - mongodata:/data/db
      - ./deploy/mongo/init-core-user.js:/docker-entrypoint-initdb.d/10-core-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # D050. Jobs waiting to be scored must survive a restart: append-only file on.
  # BullMQ needs `noeviction`: an evicted key is a lost job.
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  uploads:
  models:
  mongodata:
  redisdata:
