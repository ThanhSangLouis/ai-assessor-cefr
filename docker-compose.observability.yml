# D051: Prometheus scrapes core, web and speech; Grafana shows the dashboard
# "AI Assessor CEFR — vận hành" (requests, latency, pipeline stages, queue wait,
# time per scoring job, charged runs); Prometheus evaluates the alerts.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana listens on 127.0.0.1:3000 only (sign in as admin with GRAFANA_PASSWORD
# from .env); reach it from elsewhere through an SSH tunnel, never a public port.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    depends_on:
      - core
      - web
      - speech
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus:
  grafana:
