# D051: Prometheus scrapes every service inside the compose network. The gateway
# never forwards /metrics, so nothing here is reachable from outside.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aicefr
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8000"]
        labels: {service: core}
      - targets: ["web:8000"]
        labels: {service: web}
      - targets: ["speech:8000"]
        labels: {service: speech}
