<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 147 36" width="147" height="36" fill="none">
  <!-- Official SpeakUp Vector Brand Logo -->
  <style>
    .su-logo-speak { font-family: 'Plus Jakarta Sans', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 800; letter-spacing: -0.025em; fill: #111827; }
    .su-logo-up { font-family: 'Plus Jakarta Sans', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 850; letter-spacing: -0.025em; fill: #ff5722; }
    @media (prefers-color-scheme: dark) {
      .su-logo-speak { fill: #ffffff; }
    }
  </style>
  <g transform="translate(1, 2)" filter="drop-shadow(0 2px 5px rgba(255, 87, 34, 0.28))">
    <!-- Speech Bubble -->
    <path d="M23 1a6.5 6.5 0 0 1 6.5 6.5c0 3-2 5.5-4.8 6.3l-2.4 2c-.4.3-.9 0-.8-.5l.2-2a6.5 6.5 0 0 1-5.2-5.8A6.5 6.5 0 0 1 23 1z" fill="#ff5722"/>
    <!-- 3 Soundwave bars -->
    <rect x="20" y="5" width="1.3" height="5" rx="0.65" fill="#ffffff"/>
    <rect x="22.4" y="3.2" width="1.3" height="8.6" rx="0.65" fill="#ffffff"/>
    <rect x="24.8" y="4.8" width="1.3" height="5.4" rx="0.65" fill="#ffffff"/>
    <!-- Antenna -->
    <circle cx="11" cy="3.5" r="2" fill="#ff5722"/>
    <rect x="10.2" y="5.2" width="1.6" height="3" rx="0.8" fill="#ff5722"/>
    <!-- Left & Right Headphones -->
    <rect x="1" y="13.5" width="3" height="8.5" rx="1.5" fill="#ff5722"/>
    <rect x="19.5" y="13.5" width="3" height="8.5" rx="1.5" fill="#ff5722"/>
    <!-- Robot Head Casing -->
    <rect x="3" y="8" width="17.5" height="17.5" rx="6.5" fill="#ffffff" stroke="#ff5722" stroke-width="2.2"/>
    <!-- Dark Screen -->
    <rect x="5.5" y="11.5" width="12.5" height="10.5" rx="4" fill="#4a1c0d"/>
    <!-- Smiling Eyes -->
    <path d="M7.8 17a1.6 1.6 0 0 1 2.6 0" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M12.8 17a1.6 1.6 0 0 1 2.6 0" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark Text: SpeakUp -->
  <text x="37" y="24" class="su-logo-speak">Speak<tspan class="su-logo-up">Up</tspan></text>
</svg>
